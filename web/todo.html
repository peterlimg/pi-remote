<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <title>Your list · To-do</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="todo.css">
  <script defer src="todo.js"></script>
</head>
<body class="todo-page">
  <main class="todo-app" aria-labelledby="todo-title">
    <header class="todo-header">
      <h1 id="todo-title">Your list</h1>
      <p>One task at a time.</p>
    </header>
    <form id="new-task-form" autocomplete="off">
      <label for="new-task">What needs doing?</label>
      <div class="task-entry">
        <input id="new-task" type="text" maxlength="300" placeholder="e.g. Pick up groceries" required>
        <button type="submit">Add task</button>
      </div>
    </form>
    <p id="storage-warning" class="storage-warning" role="alert" hidden></p>
    <section class="todo-tasks" aria-label="Your tasks">
      <div class="todo-toolbar">
        <nav class="todo-filters" aria-label="Filter tasks">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">To do</button>
          <button type="button" data-filter="done" aria-pressed="false">Done</button>
        </nav>
        <p id="remaining" role="status">0 tasks left</p>
      </div>
      <ul id="task-list" aria-label="Tasks" hidden></ul>
      <div id="empty-state" class="todo-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></svg>
        <h2 id="empty-title">Room for your first task</h2>
        <p id="empty-hint">Add something above to get started.</p>
      </div>
    </section>
    <footer><p id="save-note">Saved in this browser. Not synced between devices.</p></footer>
    <noscript><p class="storage-warning">Enable JavaScript to add and save tasks.</p></noscript>
  </main>
  <template id="task-template">
    <li class="todo-task">
      <label class="task-toggle"><input type="checkbox"><span class="task-text"></span></label>
      <button class="delete-task" type="button" aria-label="Delete task">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6m4-6v6"/></svg>
      </button>
    </li>
  </template>
</body>
</html>
