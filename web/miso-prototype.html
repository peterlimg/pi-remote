<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100d10">
  <title>Miso check-ins · Pi Remote prototype</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/miso-prototype.css">
  <script type="module" src="/miso-prototype.js"></script>
</head>
<body class="miso-prototype">
  <!-- Throwaway: three ways to present Miso's automatic check-ins. Sample data only; nothing talks to the host. -->
  <div class="study">
    <div class="variant-tabs" role="tablist" aria-label="Compare presentations">
      <button type="button" role="tab" data-variant="digest">Digest</button>
      <button type="button" role="tab" data-variant="threads">Threads</button>
      <button type="button" role="tab" data-variant="inbox">Needs you</button>
    </div>
    <p id="variant-note" class="variant-note"></p>
    <div class="study-controls">
      <button type="button" class="quiet" id="next">Simulate next check-in</button>
      <button type="button" class="quiet" id="restart">Restart</button>
      <button type="button" class="quiet" id="theme">Theme</button>
    </div>
  </div>
  <main class="screen">
    <header class="miso-top">
      <span class="round" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
      <span class="miso-pill"><span id="top-bot" class="bot personality-bot" data-kind="miso"></span><span><b>Miso</b><small id="top-sub"></small></span></span>
      <span class="round" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span>
    </header>
    <section id="inbox" class="inbox" aria-label="Needs you" hidden></section>
    <div id="log" class="log" aria-live="polite"></div>
    <p id="toast" class="toast" role="status" hidden></p>
    <form id="composer" class="ask"><input id="input" autocomplete="off" placeholder="Ask Miso…" aria-label="Message Miso"><button type="submit" class="send" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>
  </main>
  <noscript><p>Enable JavaScript to try this prototype.</p></noscript>
</body>
</html>
