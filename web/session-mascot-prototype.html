<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f0">
  <title>Session mascot prototype · Pi Remote</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/session-mascot-prototype.css">
  <script type="module" src="/session-mascot-prototype.js"></script>
</head>
<body>
  <main class="page" id="page">
    <header class="preview-header"><h1>Pi</h1><span>Prototype</span></header>
    <p class="lede">One mascot for every session. Each session gets its own colour; eyes and posture show what it is doing. Sample data only.</p>
    <section class="stage" aria-label="Close up">
      <div class="stage-figures" id="stage"></div>
      <strong id="stage-state" class="stage-state"></strong>
      <div class="states" id="states">
        <button type="button" data-state="ready">Ready</button>
        <button type="button" data-state="working">Working</button>
        <button type="button" data-state="waiting">Needs input</button>
        <button type="button" data-state="settled">New reply</button>
        <button type="button" data-state="offline">Offline</button>
        <button type="button" id="play" aria-pressed="true">Auto</button>
      </div>
    </section>
    <h2 class="section-title">Colours · tap to try</h2>
    <div class="swatches" id="swatches"></div>
    <h2 class="section-title">In the list · mixed states</h2>
    <div class="rows" id="rows"></div>
    <div class="preview-controls">
      <button id="theme" type="button" class="quiet">Preview dark theme</button>
      <button id="motion" type="button" class="quiet" aria-pressed="false">Pause motion</button>
    </div>
  </main>
</body>
</html>
