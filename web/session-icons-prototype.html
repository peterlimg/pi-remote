<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100d10">
  <title>Session icon prototypes · Pi Remote</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/session-icons-prototype.css">
  <script type="module" src="/session-icons-prototype.js"></script>
</head>
<body>
  <main class="page" id="page">
    <h1>Sessions</h1>
    <p class="note">Prototype with sample data. Use the arrows to compare designs.</p>
    <div class="legend" id="legend"></div>
    <div class="session-group" id="list"></div>
  </main>
  <nav class="switcher" aria-label="Compare prototypes">
    <button id="prev" type="button" aria-label="Previous design"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <div><strong id="label" aria-live="polite"></strong><small id="description"></small></div>
    <button id="next" type="button" aria-label="Next design"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
  </nav>
</body>
</html>
