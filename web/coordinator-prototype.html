<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#100d10" media="(prefers-color-scheme: dark)">
  <title>Coordinator prototypes · Pi Remote</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/coordinator-prototype.css">
  <script type="module" src="/coordinator-prototype.js"></script>
</head>
<body class="coordinator-prototype">
  <!-- Three throwaway mobile hierarchies on one route, switchable with ?variant=A/B/C. -->
  <div class="demo-bar">
    <div><strong>Prototype</strong><span>Synthetic data · resets on reload</span></div>
    <button id="reset-demo" type="button" class="text-action">Reset</button>
  </div>
  <div class="coordinator-frame">
    <header class="coordinator-header">
      <svg class="pi-logo" viewBox="0 0 470 470" width="28" height="28" role="img" aria-label="Pi Remote">
        <path fill="#F09082" d="M0 0H352.07V234.71H234.71V117.36H0Z"/>
        <path fill="#4D9ABF" d="M0 117.36H117.36V234.71H234.71V352.07H117.36V469.43H0Z"/>
        <path fill="#F1BE58" d="M352.07 234.71H469.43V469.43H352.07V234.71Z"/>
      </svg>
      <div><h1>Coordinator</h1><p>pi-remote · Mobile improvements</p></div>
      <button id="return-coordinator" type="button" class="text-action" hidden><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>Coordinator</button>
    </header>
    <main id="prototype-view" aria-label="Coordinator prototype"></main>
    <form id="message-form" class="message-composer">
      <div class="composer-routing"><label id="composer-target" for="message-input">To Coordinator · new request</label><button id="cancel-reply" class="text-action" type="button" hidden>Cancel reply</button></div>
      <div class="composer-entry"><textarea id="message-input" rows="1" maxlength="2000" placeholder="Ask for something else…" aria-describedby="composer-note"></textarea><button id="send-message" type="submit" disabled>Send<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div>
      <p id="composer-note">Demo only. No agents run; nothing is sent or saved.</p>
    </form>
  </div>
  <p id="demo-feedback" class="sr-only" role="status"></p>
  <nav class="prototype-switcher" aria-label="Compare coordinator layouts">
    <button id="previous-variant" type="button" aria-label="Previous prototype"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <div><span id="variant-label" aria-live="polite">A · Conversation first</span><small id="variant-description">Task updates live in the thread</small></div>
    <button id="next-variant" type="button" aria-label="Next prototype"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
  </nav>
  <dialog id="task-decision" class="task-decision" aria-labelledby="decision-title" aria-describedby="decision-description">
    <h2 id="decision-title"></h2>
    <p id="decision-description"></p>
    <p class="decision-demo">Simulation only. No session or saved data will change.</p>
    <div id="decision-actions"></div>
  </dialog>
  <noscript><p>Enable JavaScript to compare these prototypes. No real sessions are connected.</p></noscript>
</body>
</html>
