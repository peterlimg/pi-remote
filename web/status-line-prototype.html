<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Status line prototypes · Pi Remote</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/status-line-prototype.css">
  <script type="module" src="/status-line-prototype.js"></script>
</head>
<body class="status-prototype">
  <!-- Throwaway: compares where a Pi-style usage/cache status line could live on the phone. Sample data only. -->
  <div class="proto-bar">
    <button id="prev" type="button" aria-label="Previous variant">‹</button>
    <div><strong id="variant-label"></strong><small id="variant-description"></small></div>
    <button id="next" type="button" aria-label="Next variant">›</button>
  </div>
  <div class="proto-options">
    <label>Scenario <select id="scenario">
      <option value="warm">Warm cache</option>
      <option value="miss">Cache miss (model switch)</option>
      <option value="full">Context nearly full</option>
      <option value="sub">Subscription</option>
      <option value="fresh">New session</option>
    </select></label>
    <label class="check"><input id="keyboard" type="checkbox" checked> Keyboard open</label>
  </div>
  <div class="proto-phone">
    <header class="proto-header">
      <span class="pill-button" aria-hidden="true">‹</span>
      <div class="proto-title"><b>Untitled session</b><span id="header-sub">pi-remote</span></div>
      <span class="pill-button" aria-hidden="true">···</span>
    </header>
    <main class="proto-transcript">
      <p class="proto-user">Can you check why the cache hit rate drops after I switch models?</p>
      <p>Switching models starts a new prompt cache, so the first turn writes the whole context again. Later turns read it back.</p>
    </main>
    <div id="above-composer"></div>
    <form id="composer" class="composer">
      <div id="inside-top"></div>
      <textarea id="prompt" rows="1" placeholder="Type / for commands"></textarea>
      <div class="composer-toolbar">
        <button id="attach" type="button" class="quiet" aria-label="Add attachments"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <div class="composer-settings"><button class="setting-control" type="button">GPT-6.1 Sol <span class="muted">Max</span></button></div>
        <svg id="fast-mode" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m13 2-9 12h7l-1 8 10-12h-7l1-8Z"/></svg>
        <div class="composer-actions">
          <button id="usage-meter" type="button" class="quiet" aria-label="Usage"></button>
          <button id="commands" type="button" class="quiet" aria-label="Commands"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m15 5-6 14"/></svg></button>
          <button id="send" type="button" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        </div>
      </div>
    </form>
    <div id="below-composer"></div>
    <div class="proto-keyboard" aria-hidden="true">Keyboard</div>
  </div>
  <dialog id="sheet" class="proto-sheet">
    <header><h2>Session usage</h2><button id="close-sheet" type="button" class="quiet">Done</button></header>
    <div id="sheet-content"></div>
  </dialog>
  <noscript>Enable JavaScript to compare these prototypes.</noscript>
</body>
</html>
