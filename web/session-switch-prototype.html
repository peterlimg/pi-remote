<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <title>Session switch prototypes · Pi Remote</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/session-switch-prototype.css">
  <script type="module" src="/session-switch-prototype.js"></script>
</head>
<body class="switch-prototype">
  <!-- Throwaway: compares swipe and long-press session switching on the conversation title, with sample sessions only. -->
  <div class="phone">
    <div class="pages-window"><div id="pages"></div></div>
    <header class="switch-header">
      <a class="round" href="/" aria-label="Back to Pi Remote"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
      <button id="pill" type="button"><div class="title-window"><div id="title-strip"></div></div></button>
      <span class="round" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></span>
    </header>
    <div id="nearby" class="nearby" hidden>
      <button id="nearby-backdrop" class="nearby-backdrop" type="button" aria-label="Close nearby sessions"></button>
      <div id="nearby-list" class="nearby-list" role="menu" aria-label="Nearby sessions"></div>
    </div>
    <p class="gesture-hint"><span id="hint"></span> · <span id="position"></span></p>
  </div>
  <dialog id="cards" class="cards-sheet" aria-labelledby="cards-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header><h2 id="cards-title">Nearby sessions</h2><button id="cards-done" type="button">Done</button></header>
    <div id="card-row" class="card-row"></div>
  </dialog>
  <nav class="prototype-switcher" aria-label="Compare prototype gestures">
    <button id="previous-variant" type="button" aria-label="Previous prototype"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <div><span id="variant-label" aria-live="polite"></span><small id="variant-description"></small></div>
    <button id="next-variant" type="button" aria-label="Next prototype"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
  </nav>
  <noscript><p>Enable JavaScript to try these prototypes. This page uses sample data and does not connect to your sessions.</p></noscript>
</body>
</html>
