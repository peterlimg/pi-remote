<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Claude thinks. Pi does the work. Signal print artwork</title>
<style>
@font-face{font-family:Bricolage;src:url(data:font/woff2;base64,__GUIDE_FONT__) format('woff2');font-weight:400 800;font-display:block}
*{box-sizing:border-box}body{margin:0;background:#dfe5e2;font-family:Bricolage,sans-serif}.cover{position:relative;isolation:isolate;width:1200px;height:600px;overflow:hidden;margin:0;background:#e65b3d;color:#221c28}.cover canvas{position:absolute;inset:0;width:1200px;height:600px;z-index:-1}.cover h1,.cover p{margin:0}.cover h1{position:absolute;left:54px;top:44px;font-size:88px;line-height:.96;font-weight:700;letter-spacing:-.035em}.cover h1 span{display:block}.cover h1 span+span{margin-top:33px;color:#fff3dd}.footer,.domain{position:absolute;bottom:29px;font-weight:500;font-size:21px;letter-spacing:-.015em}.footer{left:54px;font-size:20px}.domain{right:54px;font-size:17px}
</style>
<!-- Offline authoring source. Only the two rendered PNGs are served. -->
<article class="cover">
  <canvas width="1200" height="600" aria-hidden="true"></canvas>
  <h1><span>Claude<br>thinks.</span><span>Pi does<br>the work.</span></h1>
  <p class="footer">Tools, permissions and history stay in Pi.</p>
  <p class="domain">claude-sdk-in-pi.vercel.app</p>
</article>
<script>
function renderPrint() {
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('Canvas is required to render the print artwork.');
  let seed = 819, dots = 0;
  const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const mask = document.createElement('canvas'); mask.width = 1200; mask.height = 600;
  const m = mask.getContext('2d');
  m.font = '800 265px Bricolage'; m.fillText('Pi', 739, 404);
  const pixels = m.getImageData(0, 0, 1200, 600).data;
  ctx.fillStyle = '#221c28';
  for (let y = 32; y < 532; y += 4.5) {
    for (let x = 612; x < 1170; x += 4.5) {
      const dx = x - 890, dy = (y - 287) * 1.05;
      const angle = Math.atan2(dy, dx), radius = Math.hypot(dx, dy);
      const edge = 205 + 30 * Math.cos(angle * 9 + .9) + 13 * Math.cos(angle * 5 - .4);
      const ink = pixels[(Math.floor(y) * 1200 + Math.floor(x)) * 4 + 3] > 100;
      if (radius > edge || ink) continue;
      const wave = Math.sin(radius * .14 + Math.sin(angle * 3) * 7 + dx * .013);
      const size = (.6 + (wave + 1) * .58) * (.7 + random() * .6);
      ctx.beginPath(); ctx.arc(x + (random() - .5), y + (random() - .5), size, 0, Math.PI * 2); ctx.fill();
      dots++;
    }
  }
  if (dots < 1000) throw new Error('The print artwork is incomplete.');
  ctx.strokeStyle = '#221c28'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(623, 504); ctx.lineTo(1150, 504); ctx.stroke();
}
(async () => {
  await document.fonts.load('800 265px Bricolage');
  await document.fonts.load('700 88px Bricolage');
  await document.fonts.ready;
  renderPrint();
  window.__sdkSocialReady = true;
})().catch(error => { window.__sdkSocialError = error.message; });
</script>
</html>
