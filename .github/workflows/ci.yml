name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/2
      - run: npm run test:lifecycle
        if: matrix.shard == 1
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-browser-results-${{ matrix.shard }}
          path: |
            test-results/
            ${{ runner.temp }}/pi-lifecycle-e2e-*/
  pi-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm install --no-save @earendil-works/pi-coding-agent@0.85.1
      - run: node test/pi-smoke.mjs
  claude-sdk-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/claude-sdk-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm install --ignore-scripts
        working-directory: .
      - run: npm run test:recovery
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run test:malformed
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run test:cancel
        env:
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sdk-recovery-results
          path: |
            ${{ runner.temp }}/pi-sdk-recovery-e2e-*/
            ${{ runner.temp }}/pi-sdk-malformed-e2e-*/
            ${{ runner.temp }}/pi-sdk-cancel-e2e-*/
